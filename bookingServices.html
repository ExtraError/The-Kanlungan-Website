<!DOCTYPE html>
<html>
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="KanlunganCSS.css">
    

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playball&display=swap" rel="stylesheet">


    <!-- <link rel="icon" type="image/svg+xml" href="hamburgerMenu.svg">
    <link rel="alternate icon" href="favicon.ico"> -->


    </head>
    <body>

        <div id="header"></div>


    <script>
      fetch("header.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById('header').innerHTML = data;

        initHamburger();
      })


    </script>



        <div class="chooseServiceBody">
        <form id="choosingService">
            <div class="chooseOption">
                <p>What service do you need?</p>
            </div>

            <div class="chooseService">
                <div class="domicareContainer containerService">
                    Domiciliary care
                    <div class="chooseCircle">
                        <label class="chooseServ">
                        <input type="radio" name="service" value="Domiciliary care">
                        <span class="circle"></span>
                        </label>
                    </div>
                </div>

                <div class="homecareContainer containerService">
                    Home health care
                    <div class="chooseCircle">
                        <label class="chooseServ">
                        <input type="radio" name="service" value="Home health care">
                        <span class="circle"></span>
                        </label>
                    </div>
                </div>

                <div class="homesupportContainer containerService">
                    Home care support
                    <div class="chooseCircle">
                        <label class="chooseServ">
                        <input type="radio" name="service" value="Home care support">
                        <span class="circle"></span>
                        </label>
                    </div>
                </div>

                <div class="personalassistContainer containerService">
                    Personal Assistance
                    <div class="chooseCircle">
                        <label class="chooseServ">
                        <input type="radio" name="service" value="Personal Assistance">
                        <span class="circle"></span>
                        </label>
                    </div>
                </div>
            </div>
        
        

         <!--    FORMS  -->

            <div class="fillUpForm">
                <p>Please fill up this form by entering your details here..</p>
            </div>

            <div class="chooseBody">

              <div class="userCon1">
                <input type="text" placeholder="Enter your name" name="firstname">
                <input type="text" placeholder="Enter your lastname" name="lastname">
              </div>

                <input class="userCon1" type="text" placeholder="Enter building and street address..." name="streetAddress">

             <div class="addressRow">
                <input type="text" placeholder="Enter your city..." name="cityAddress">
                <input type="text" placeholder="Enter your province..." name="provinceAddress">
                <input type="text" placeholder="Enter your zip code..."
                name="zipCode">
             </div>

                <input class="userCon1" type="text" placeholder="Enter your email..." name="email">

              <div class="userCon1">

                <label for="phone">Phone number:</label>


                    <select id="countryCode">
                      <option value="+358">FI (+358)</option>
                      <option value="+63">PH (+63)</option>
                    </select>


                <input id="phone" class="user1" type="tel" placeholder="Ex. 447512003" name="phone">
              </div>
              
                  <textarea placeholder="You can write your message here..." class="textArea" name="message"></textarea>

                  <div class="boton">
                    <button type="submit">Send Message</button>
                  </div>
            </div>

             </form>

        </div>

       <div id="footer"></div>

    <script>
      fetch("footer.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById('footer').innerHTML = data;
    });
    </script>

<script src="kanlunganJS.js"></script>
    </body>
</html>
