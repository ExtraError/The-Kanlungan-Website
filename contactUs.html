<!DOCTYPE html>
<html>
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="KanlunganCSS.css">
    

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playball&display=swap" rel="stylesheet">


    <link rel="icon" type="image/svg+xml" href="hamburgerMenu.svg">
    <link rel="alternate icon" href="favicon.ico">

  </head>


  <body>

    <div id="header"></div>

    <script src="kanlunganJS.js"></script>

    <script>
      fetch("header.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById('header').innerHTML = data;

        initHamburger();
      })

    </script>

    <form>
      <div>
        <input type="text" placeholder="Enter your name">
        <input type="text" placeholder="Enter your lastname">
      </div>

      <div>
        <label for="phone">Phone number:</label>
        <select class="areaCode">
          <option value="+358">Finland (+358)</option>
        </select>
        <input type="tel" placeholder="Ex. 447512003">
      </div>

      <textarea placeholder="You can write your message here..."></textarea>
      <button type="submit" class="boton">Send Message</button>
    </form>



  </body>
</html>
